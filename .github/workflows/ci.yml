name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: pip install -r backend/requirements.lock
      - run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
      - run: python -m compileall -q backend/app
      - run: python scripts/secret_scan.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: npm install --global pnpm@11.9.0 --ignore-scripts --no-audit --no-fund
      - working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: SONGLIB_ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - run: docker build --tag songlib-amp:ci .
