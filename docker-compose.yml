name: ${COMPOSE_PROJECT_NAME:-songlib-amp}

x-songlib-common: &songlib-common
  image: ${SONGLIB_IMAGE:-songlib-amp:1.0.0-rc.2}
  restart: unless-stopped
  env_file:
    - ${SONGLIB_ENV_FILE:-.env}
  environment:
    TZ: ${TZ:-Asia/Shanghai}
    APP_ENV: production
    APP_VERSION: 1.0.0-rc.2
    DATA_DIR: /data
    MUSIC_ROOT: /music
    DOWNLOAD_ROOT: /downloads
    PLEX_CONFIG: /plex-config
    NODE_BINARY: /usr/bin/node
  volumes:
    - ${SONGLIB_DATA_DIR:-./volumes/data}:/data
    - ${SONGLIB_DOWNLOADS_DIR:-./volumes/downloads}:/downloads
    - ${MUSIC_DIR:-./volumes/music}:/music
    - ${READ_ONLY_LIBRARY_DIR:-./volumes/library}:/music/library:ro
    - ${PLEX_CONFIG_DIR:-./volumes/plex-config}:/plex-config:ro
  networks:
    - songlib-internal
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  web:
    <<: *songlib-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: production
      APP_VERSION: 1.0.0-rc.2
      DATA_DIR: /data
      MUSIC_ROOT: /music
      DOWNLOAD_ROOT: /downloads
      PLEX_CONFIG: /plex-config
      NODE_BINARY: /usr/bin/node
      PORT: 8080
      WORKER_MODE: web
    ports:
      - ${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-32782}:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  worker:
    <<: *songlib-common
    command: ["python", "-m", "app.worker"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: production
      APP_VERSION: 1.0.0-rc.2
      DATA_DIR: /data
      MUSIC_ROOT: /music
      DOWNLOAD_ROOT: /downloads
      PLEX_CONFIG: /plex-config
      NODE_BINARY: /usr/bin/node
      WORKER_MODE: worker
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true

networks:
  songlib-internal:
    name: ${COMPOSE_PROJECT_NAME:-songlib-amp}-internal
    driver: bridge
