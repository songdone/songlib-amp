services:
  songlib:
    image: 666uos/songlib-amp:latest
    container_name: songlib-amp-fnos
    restart: unless-stopped
    user: "${TRIM_UID}:${TRIM_GID}"
    environment:
      TZ: Asia/Shanghai
      APP_ENV: production
      WORKER_MODE: embedded
      PORT: "8080"
      AIRPLAY_CAST_ENABLED: "true"
      AIRPLAY_ENCODER: auto
      AIRPLAY_WIDTH: "1920"
      AIRPLAY_HEIGHT: "1080"
      AIRPLAY_FPS: "30"
      AIRPLAY_RENDER_FPS: "4"
      AIRPLAY_SEGMENT_SECONDS: "0.5"
      AIRPLAY_LYRIC_ADVANCE_MS: "250"
      AIRPLAY_PIPELINE_ADVANCE_MS: "1750"
    ports:
      - "${wizard_port}:8080"
    volumes:
      - "${TRIM_PKGVAR}:/data"
      - "/var/apps/songlib-amp/shares/songlib-amp/downloads:/downloads"
      - "/var/apps/songlib-amp/shares/songlib-amp/music:/music"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
